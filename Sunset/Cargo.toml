[package]
name                = "sunset"
version             = "0.0.16"
authors             = [ "Miezhiko" ]
repository          = "https://github.com/Miezhiko/Sunset"
readme              = "README.md"
keywords            = [ "discord", "bot" ]
edition             = "2024"
description         = "discord bot for specific needs"
license             = "QUADROBER"
rust-version        = "1.85.0"

[features]
default = []

[dependencies]
anyhow                  = "1"
tracing                 = "0.1"
tracing-subscriber      = "0.3"
serde                   = "1"
serde_derive            = "1"
serde_json              = "1"
serde_dhall             = "0.13"
nipper                  = "0.1"
quick-xml               = { version = "0.41", features = ["serialize"] }
sled                    = "=1.0.0-alpha.124"
twilight-http           = "0.16.0"
twilight-gateway        = "0.16.0"
twilight-cache-inmemory = "0.16.0"
twilight-model          = "0.16.0"
regex                   = "1"
chrono                  = "0.4"

[dependencies.twilight-util]
version = "0.16.0"
features = ["builder"]

[dependencies.reqwest]
version = "0.12"
features = ["json", "blocking"]

[dependencies.tokio]
default-features = false
features = ["macros", "signal", "rt-multi-thread"]
version = "1"
